[project]
name = "dubizzle-car-assistant"
version = "1.0.0"
description = "AI car-buying assistant for the dubizzle cars marketplace"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "litellm>=1.40",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "scikit-learn>=1.4",
    "streamlit>=1.35",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]